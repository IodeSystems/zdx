services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:7650:5432"
    environment:
      POSTGRES_USER: zdx
      POSTGRES_PASSWORD: zdx
      POSTGRES_DB: zdx
    volumes:
      # Mount the parent dir so pg18 (and future majors) can lay out
      # /var/lib/postgresql/<MAJOR>/docker/ — this is the structure the
      # postgres:18 image uses by default, and it leaves room for a
      # future side-by-side pg_upgrade --link.
      - ./home/data/postgres:/var/lib/postgresql

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:7651:6379"
    volumes:
      - ./home/data/valkey:/data
