services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:7650:5432"
    environment:
      POSTGRES_USER: zdx
      POSTGRES_PASSWORD: zdx
      POSTGRES_DB: zdx
    volumes:
      - ./home/data/postgres:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:7651:6379"
    volumes:
      - ./home/data/valkey:/data
