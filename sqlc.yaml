version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "migrations/"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_params_struct_pointers: false
        emit_result_struct_pointers: false
        emit_methods_with_db_argument: false
        emit_prepared_queries: false
        emit_interface: true
