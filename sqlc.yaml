version: "2"
plugins:
- name: metaquery
  process:
    cmd: /home/nthalk/local/src/iodesystems/sqlc-go-codegen-metaquery/bin/sqlc-go-codegen-metaquery
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "schema/shipped.sql"
    codegen:
    - plugin: metaquery
      out: "internal/db"
      options:
        package: db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_db_tags: true
        emit_params_struct_pointers: false
        emit_result_struct_pointers: false
        emit_methods_with_db_argument: false
        emit_prepared_queries: false
        emit_interface: true
        emit_metaquery: cols
