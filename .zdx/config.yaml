remote:
  url: https://zdx.iodesystems.com
  slug: zdx

agent:
  llm_provider: claude
  claude_model: claude-sonnet-4-6
  max_worktrees: 4
  lease_minutes: 30

components:
  server:
    build:
      steps:
        - name: compile
          run: go build ./...
    test:
      unit:
        runner: basic
        run: go test ./...
    lint:
      go:
        dirs: [internal, cmd]
    close:
      steps:
        - name: gen
          run: ./bin/db gen
        - name: lint
          run: ./bin/lint
